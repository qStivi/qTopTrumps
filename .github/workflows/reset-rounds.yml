name: Reset review rounds

# Slash-command maintenance for the review round cap: posting `/reset-rounds`
# on a PR posts a "**Review rounds reset**" marker comment. The round counter
# in review.yml counts only "**Review (round N)**" comments at/after the newest
# marker, so the next review starts at round 0. Nothing is deleted — round
# comments stay on the PR as history.
# Use case per round discipline: "same PR, restructured approach" after the
# cap was hit or after a rethink. Only the repo owner may trigger it.

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  reset:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/reset-rounds' &&
      github.event.comment.user.login == 'qStivi'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post reset marker (round comments are kept as history)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "**Review rounds reset** — the next review starts at round 0. Round comments are kept as history; the counter counts only rounds posted after this marker."
